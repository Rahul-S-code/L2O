# Render blueprint: one web service. The Excel files are read from GitHub; the small disk keeps saved quotes.
services:
  - type: web
    name: uc-order-hub
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance
    healthCheckPath: /healthz
    disk:
      name: uc-order-hub-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERS     # e.g. rahul:a-long-password,second-admin:another-password
        sync: false
      - key: GITHUB_REPO     # where the Excel files live (data/*.xlsx)
        value: Rahul-S-code/L2O
      - key: GITHUB_TOKEN    # fine-grained token with Contents read and write on that repo; lets admins upload from the app
        sync: false
      - key: VIEWER_PASSWORD # optional team password for everyone else; leave empty to keep the site open
        sync: false
